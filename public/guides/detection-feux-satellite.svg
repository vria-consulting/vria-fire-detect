<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" font-family="Verdana, DejaVu Sans, sans-serif">
  <rect width="1200" height="630" fill="#0E1B2E"/>
  <text x="600" y="66" text-anchor="middle" font-size="38" font-weight="bold" fill="#FBF9F4">Deux familles de satellites voient les feux</text>

  <!-- Terre -->
  <circle cx="600" cy="1180" r="640" fill="#1E5B3A"/>
  <circle cx="600" cy="1180" r="640" fill="none" stroke="#3A9D5B" stroke-width="3"/>
  <!-- feu au sol -->
  <path d="M596 528 q-10 -14 -2 -26 q2 8 8 10 q-4 -16 8 -24 q0 12 6 16 q4 -6 3 -13 q11 11 8 27 q-3 13 -15 16 q-11 3 -16 -6 z" fill="#E8622C"/>
  <circle cx="600" cy="540" r="5" fill="#FFC72E"/>

  <!-- satellite défilant (bas) -->
  <g transform="translate(320,330)">
    <rect x="-16" y="-10" width="32" height="20" rx="4" fill="#FBF9F4"/>
    <rect x="-52" y="-7" width="30" height="14" fill="#4A90C2"/>
    <rect x="22" y="-7" width="30" height="14" fill="#4A90C2"/>
  </g>
  <path d="M120 430 Q 600 180 1080 430" fill="none" stroke="#4A90C2" stroke-width="2.5" stroke-dasharray="8 8" opacity="0.8"/>
  <!-- fauchée étroite -->
  <path d="M320 350 L560 535 L610 520 Z" fill="#4A90C2" opacity="0.28"/>
  <text x="235" y="290" font-size="24" font-weight="bold" fill="#8FC1E8">Défilant · VIIRS</text>
  <text x="235" y="322" font-size="21" fill="#C9DDF0">830 km · pixel 375 m</text>
  <text x="235" y="350" font-size="21" fill="#C9DDF0">~2 passages/jour</text>

  <!-- satellite géostationnaire (haut) -->
  <g transform="translate(870,150)">
    <rect x="-18" y="-11" width="36" height="22" rx="4" fill="#FBF9F4"/>
    <rect x="-58" y="-8" width="34" height="16" fill="#FFC72E"/>
    <rect x="24" y="-8" width="34" height="16" fill="#FFC72E"/>
  </g>
  <!-- cône large -->
  <path d="M870 175 L480 545 L1050 505 Z" fill="#FFC72E" opacity="0.22"/>
  <text x="800" y="120" text-anchor="end" font-size="24" font-weight="bold" fill="#FFD978">Géostationnaire · GOES, Meteosat</text>
  <text x="800" y="152" text-anchor="end" font-size="21" fill="#F2E2B8">36 000 km · pixel 2-4 km</text>
  <text x="800" y="180" text-anchor="end" font-size="21" fill="#F2E2B8">re-scan toutes les 10 min</text>

  <text x="600" y="600" text-anchor="middle" font-size="22" fill="#C9CFD8">Le défilant voit fin mais rarement · le géostationnaire voit large mais souvent : kanari croise les deux</text>
  <text x="1140" y="120" text-anchor="end" font-size="22" font-weight="bold" fill="#8A9099">kanari.io</text>
</svg>
